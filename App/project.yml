name: BiliScope
options:
  bundleIdPrefix: com.tangluyao
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  BiliScope:
    path: ..

targets:
  BiliScope:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: 哔哩加速
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UIBackgroundModes:
          - audio
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocalNetworkUsageDescription: 仅在本机运行 B 站专用代理，不访问局域网内的其他设备。
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tangluyao.biliscope
        PRODUCT_NAME: BiliScope
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    dependencies:
      - package: BiliScope
        product: BiliScopeCore
